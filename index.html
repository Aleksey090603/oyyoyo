<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементарно — Смотреть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 720px;
            width: 100%;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .btn {
            padding: 18px 64px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 40px rgba(245, 87, 108, 0.55);
        }

        .btn:active { transform: translateY(-1px) scale(0.99); }

        /* Плеер (скрыт до нажатия) */
        .player-wrap {
            display: none;
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            background: #000;
        }

        .player-wrap.active { display: block; }

        .player-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Элементарно</div>
        <div class="subtitle">Мультфильм · Начало с 57:03</div>

        <!-- Кнопка "Нажми" -->
        <div id="startBlock">
            <button class="btn" onclick="startVideo()">Нажми</button>
        </div>

        <!-- Плеер (появляется после клика) -->
        <div class="player-wrap" id="playerWrap">
            <iframe
                id="vkPlayer"
                data-src="https://vk.com/video_ext.php?oid=-220018529&id=456248228&t=3423s&autoplay=1&hd=2"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        function startVideo() {
            // Прячем кнопку
            document.getElementById('startBlock').classList.add('hidden');

            // Показываем плеер
            document.getElementById('playerWrap').classList.add('active');

            // Загружаем видео в iframe (запускается только сейчас)
            const iframe = document.getElementById('vkPlayer');
            iframe.src = iframe.dataset.src;
        }
    </script>
</body>
</html>
