<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементарно — Смотреть</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 48px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-block;
            padding: 18px 64px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 40px rgba(245, 87, 108, 0.55);
        }

        .btn:active {
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .hint {
            margin-top: 24px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Элементарно</div>
        <div class="subtitle">Мультфильм · Начало с 57:03</div>

        <button class="btn" onclick="openVideo()">Нажми</button>

        <div class="hint">Откроется в новой вкладке</div>
    </div>

    <script>
       function openVideo() {
    var videoUrl = 'https://vkvideo.ru/video-220018529_456248228?t=3423s';
    
    // Схема для приложения VK (работает в большинстве случаев)
    var appScheme = 'vk://video-220018529_456248228';
    
    // Пробуем открыть приложение
    var now = Date.now();
    window.location.href = appScheme;
    
    // Если приложение не открылось за 1 секунду — открываем браузер
    setTimeout(function() {
        if (Date.now() - now < 1500) {
            window.open(videoUrl, '_blank');
        }
    }, 1000);
}
    </script>
</body>
</html>
