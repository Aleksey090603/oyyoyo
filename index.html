<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементарно — Смотреть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 720px;
            width: 100%;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 24px;
            font-weight: 300;
        }

        .player-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            background: #000;
        }

        .player-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.5;
        }

        .qr-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 14px;
            border-radius: 18px;
            width: fit-content;
            margin: 12px auto 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        #qrcode img, #qrcode canvas {
            display: block;
            width: 180px !important;
            height: 180px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Элементарно</div>
        <div class="subtitle">Мультфильм · Начало с 57:03</div>

        <!-- Встроенный плеер VK -->
        <div class="player-wrap">
            <iframe
                id="vkPlayer"
                src="https://vk.com/video_ext.php?oid=-220018529&id=456248228&t=3423s&autoplay=1&hd=2"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;"
                allowfullscreen>
            </iframe>
        </div>

        <div class="hint">
            Если видео не запустилось само — просто нажмите ▶ в плеере.
            <br>Браузеры блокируют автозапуск со звуком из соображений безопасности.
        </div>

        <div class="qr-section">
            <div style="font-size:0.85rem;color:rgba(255,255,255,0.75);letter-spacing:0.5px;text-transform:uppercase;">QR на этот сайт</div>
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const siteUrl = 'https://aleksey090603.github.io/oyyoyo/';

        new QRCode(document.getElementById("qrcode"), {
            text: siteUrl,
            width: 180,
            height: 180,
            colorDark: "#1a1a2e",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
