<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементарно — Смотреть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 480px;
            width: 100%;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .btn {
            padding: 18px 64px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 40px rgba(245, 87, 108, 0.55);
        }

        .btn:active { transform: translateY(-1px) scale(0.99); }

        .qr-section {
            margin-top: 36px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .qr-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 18px;
            border-radius: 20px;
            width: fit-content;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        #qrcode img, #qrcode canvas {
            display: block;
            width: 240px !important;
            height: 240px !important;
        }

        .hint {
            margin-top: 16px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Элементарно</div>
        <div class="subtitle">Мультфильм · Начало с 57:03</div>

        <button class="btn" onclick="openVideo()">Нажми</button>

        <div class="qr-section">
            <div class="qr-label">Или отсканируйте QR-код</div>
            <div id="qrcode"></div>
            <div class="hint">QR ведёт на этот сайт</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // Ссылка на видео с 57:03 (3423 секунды)
        const videoUrl = 'https://vkvideo.ru/video-220018529_456248228?t=3423s';

        // Ссылка на ваш сайт (для QR-кода)
        const siteUrl = 'https://aleksey090603.github.io/oyyoyo/';

        function openVideo() {
            window.open(videoUrl, '_blank');
        }

        // QR-код ведёт на этот сайт
        new QRCode(document.getElementById("qrcode"), {
            text: siteUrl,
            width: 240,
            height: 240,
            colorDark: "#1a1a2e",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });
    </script>
</body>
</html>
